name: kennembed release bundles
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive kennembed bundles
        required: true
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: namespace-profile-linux-4cpu
          - os: darwin
            runner: namespace-profile-mac-6cpu
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 13
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      TARGET_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build both architectures and package runtime dependencies
        shell: python
        run: |
          import os, pathlib, platform, re, shutil, subprocess
          tag = os.environ['RELEASE_TAG'] or re.search(r'const BundleTag = "([^"]+)"', pathlib.Path('internal/embedassets/bundle.go').read_text()).group(1)
          version = tag.removeprefix('v')
          target = os.environ['TARGET_OS']
          source = pathlib.Path('.').resolve()
          release = bool(os.environ['RELEASE_TAG'])
          if release:
              subprocess.run(['git', 'fetch', '--depth=1', 'origin', 'tag', tag], check=True)
              subprocess.run(['git', 'worktree', 'add', '--detach', 'release-source', tag], check=True)
              source = pathlib.Path('release-source').resolve()
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=source, text=True).strip()
          native_arch = 'arm64' if platform.machine().lower() in ('arm64', 'aarch64') else 'amd64'
          output = pathlib.Path('dist')
          output.mkdir()
          for arch in ('amd64', 'arm64'):
              bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / ('kennembed-' + arch) / 'bundle'
              subprocess.run(['python', str(source / '.github/scripts/stage-onnx.py'), '--os', target, '--arch', arch, '--output', str(bundle)], cwd=source, check=True)
              executable = bundle / ('kennembed.exe' if target == 'windows' else 'kennembed')
              subprocess.run(['go', 'build', '-trimpath', '-buildvcs=true', '-o', str(executable), './cmd/kennembed'], env=dict(os.environ, GOOS=target, GOARCH=arch, CGO_ENABLED='0'), cwd=source, check=True)
              metadata = subprocess.check_output(['go', 'version', '-m', str(executable)], text=True)
              if release and ('vcs.revision=' + revision not in metadata or 'vcs.modified=false' not in metadata):
                  raise RuntimeError('bundle source does not match the selected tag')
              # selfupdate.ExtractTarGz and ExtractZip require these archive formats.
              name = output / ('kennembed_' + version + '_' + target + '_' + arch)
              archive = shutil.make_archive(str(name), 'zip' if target == 'windows' else 'gztar', bundle)
              if arch == native_arch:
                  with open(os.environ['GITHUB_ENV'], 'a') as env:
                      # The bundle test installs from the final archive, not this staging directory.
                      env.write('KIT_EMBED_TEST_ARCHIVE=' + str(pathlib.Path(archive).resolve()) + '\n')
                      libraries = list(bundle.glob('libonnxruntime.*')) + list(bundle.glob('onnxruntime.dll'))
                      library = next(path for path in libraries if path.name.endswith(('1.23.2', '1.23.2.dylib', '.dll')))
                      env.write('KIT_EMBED_TEST_LIBRARY=' + str(library) + '\n')
                      env.write('KIT_EMBED_TEST_DIR=' + str(bundle.parent / 'model') + '\n')
      - name: Cache verified model and photograph fixtures
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.KIT_EMBED_TEST_DIR }}
          key: kennembed-models-${{ runner.os }}-${{ runner.arch }}-nomic-cf5b5a86-d241a60d-faces-af6d057c-f12e1279-${{ hashFiles('embedserver/testdata/faces/*') }}
      - name: Stage verified model and photograph fixtures
        shell: bash
        run: .github/actions/kit-retry/kit-retry 3 5 go run .github/scripts/stage-embed-test.go
      - name: Exercise the native server and models
        run: make test-embedserver GOTESTSUM_SUITE=kennembed-${{ matrix.os }}
      - name: Upload gotestsum results
        if: failure() || github.run_attempt > 1 || hashFiles(format('gotestsum/kennembed-{0}-reruns.txt', matrix.os)) != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-kennembed-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: kennembed-${{ matrix.os }}
          path: dist/*
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: bundle
    runs-on: namespace-profile-linux-4cpu
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: kennembed-*
          merge-multiple: true
          path: dist
      - name: Attach verified bundles to the existing release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          sha256sum kennembed_* > SHA256SUMS
          gh release upload "$RELEASE_TAG" kennembed_* SHA256SUMS
