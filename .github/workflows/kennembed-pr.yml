name: kennembed release bundles

on:
  pull_request:
    paths:
      - '.github/workflows/kennembed.yml'
      - '.github/workflows/kennembed-pr.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/stage-onnx.py'
      - 'cmd/kennembed/**'
      - 'embedserver/**'
      - 'embedlocal/**'
      - 'embedclient/**'
      - 'internal/embedassets/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'

permissions:
  contents: read

jobs:
  bundle:
    cache-mode: read
    uses: ./.github/workflows/kennembed.yml
