name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR runs are keyed by PR number (repo-assigned, so a fork branch named "main"
# cannot collide with and cancel trusted runs on this repo's main). Push and
# workflow_dispatch runs share a group per ref_name so a dispatched run is
# cancelled when a push supersedes it, and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Go hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run golangci-lint
        run: make lint

  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go tool gotestsum --format pkgname-and-test-fails --jsonfile=test-output-${{ matrix.os }}.json -- ./...

      - name: Run go vet
        run: go vet ./...

  streaming-gates:
    name: Streaming race and portability gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run streaming race tests
        run: go test -race ./pack ./packstore ./backup

      - name: Compile streaming packages for Linux 386
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: "386"
        run: |
          go test -c -o "${RUNNER_TEMP}/kit-pack-linux386.test" ./pack
          go test -c -o "${RUNNER_TEMP}/kit-packstore-linux386.test" ./packstore
          go test -c -o "${RUNNER_TEMP}/kit-backup-linux386.test" ./backup

      - name: Compile fail-closed storage packages for Plan 9
        env:
          CGO_ENABLED: "0"
          GOOS: plan9
          GOARCH: amd64
        run: |
          go test -c -o "${RUNNER_TEMP}/kit-pack-plan9.test" ./pack
          go test -c -o "${RUNNER_TEMP}/kit-packstore-plan9.test" ./packstore

      - name: Verify current streamed packs with the v0.7.0 reader
        run: |
          go run ./tools/packstreamfixture -out "${RUNNER_TEMP}/current-stream.pack"
          mkdir "${RUNNER_TEMP}/v070-reader"
          cp tools/packv1reader/main.go "${RUNNER_TEMP}/v070-reader/main.go"
          cd "${RUNNER_TEMP}/v070-reader"
          go mod init compatibility-reader
          go mod edit -require go.kenn.io/kit@v0.7.0
          go mod tidy
          go run . -pack "${RUNNER_TEMP}/current-stream.pack"

  s3-conformance:
    name: S3-compatible backend conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Start S3-compatible service
        # MinIO no longer publishes images, so conformance runs against
        # RustFS 1.0.0, pinned by digest. Docker picks a free host port.
        run: |
          docker run --detach --rm \
            --name kit-s3-conformance \
            --publish 127.0.0.1::9000 \
            --env RUSTFS_ACCESS_KEY=kit-test \
            --env RUSTFS_SECRET_KEY=kit-test-secret \
            docker.io/rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
          endpoint="http://$(docker port kit-s3-conformance 9000/tcp)"
          echo "KIT_S3_TEST_ENDPOINT=${endpoint}" >> "${GITHUB_ENV}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${endpoint}/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kit-s3-conformance
          exit 1

      - name: Run real-service conformance
        env:
          KIT_S3_TEST_ACCESS_KEY: kit-test
          KIT_S3_TEST_SECRET_KEY: kit-test-secret
          KIT_S3_TEST_BUCKET: kit-conformance
        run: go test -race ./packstore/s3store

  search-backends:
    name: Search backend conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Start PostgreSQL and ClickHouse
        run: |
          docker run --detach --rm \
            --name kit-postgres-conformance \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_DB=kit \
            pgvector/pgvector:pg17
          docker run --detach --rm \
            --name kit-clickhouse-conformance \
            --publish 127.0.0.1:9000:9000 \
            --env CLICKHOUSE_SKIP_USER_SETUP=1 \
            clickhouse/clickhouse-server:26.2
          for attempt in $(seq 1 60); do
            pg=$(docker exec kit-postgres-conformance pg_isready -U postgres || true)
            ch=$(docker exec kit-clickhouse-conformance clickhouse-client --query 'SELECT 1' || true)
            if echo "$pg" | grep -q "accepting" && [ "$ch" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs kit-postgres-conformance
          docker logs kit-clickhouse-conformance
          exit 1

      - name: Run backend conformance
        env:
          KIT_POSTGRES_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/kit?sslmode=disable
          KIT_CLICKHOUSE_TEST_ADDR: 127.0.0.1:9000
        run: go test -count=1 ./search/postgres ./search/clickhouse
